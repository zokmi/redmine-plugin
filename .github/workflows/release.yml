name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Node dependencies
        working-directory: redmine-mcp-node
        run: npm ci --no-audit --no-fund
      - name: Verify Windows service recovery on PowerShell 5.1 and 7
        if: runner.os == 'Windows'
        working-directory: redmine-mcp-node
        run: |
          $env:PSExecutionPolicyPreference = 'Bypass'
          npm test
      - name: Verify Node runtime and native storage
        if: runner.os != 'Windows'
        working-directory: redmine-mcp-node
        run: npm test
      - name: Verify release change collectors
        run: node --test skills/release-change-items/tests/cli.test.mjs

  release:
    needs: runtime
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Node.js launcher syntax
        run: node --check scripts/local-service.mjs

      - name: Verify tag and main ancestry
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git rev-parse --verify "refs/tags/$RELEASE_TAG"
            git fetch origin main --no-tags
            git merge-base --is-ancestor HEAD FETCH_HEAD
          else
            RELEASE_TAG=$(node -p '"v" + require("./redmine-mcp-node/package.json").version')
          fi
          node scripts/check-plugin-release.mjs "$RELEASE_TAG"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
