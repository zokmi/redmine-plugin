name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify tag and main ancestry
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git rev-parse --verify "refs/tags/$RELEASE_TAG"
            git fetch origin main --no-tags
            git merge-base --is-ancestor HEAD FETCH_HEAD
          else
            RELEASE_TAG=$(python -c 'import tomllib; from pathlib import Path; print("v" + tomllib.loads(Path("redmine-mcp/pyproject.toml").read_text())["project"]["version"])')
          fi
          python scripts/check_plugin_release.py "$RELEASE_TAG"

      - uses: astral-sh/setup-uv@v5

      - name: Verify plugin workflows
        working-directory: redmine-mcp
        run: |
          uv sync --locked --all-groups
          uv run ruff check .
          uv run pytest -q -rs

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
