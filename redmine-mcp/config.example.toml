# Redmine MCP server 參數檔範本
#
# 使用方式（擇一）：
#   以原始碼執行：複製本檔為專案根目錄的 config.toml（已列入 .gitignore）
#   以套件安裝執行：複製到使用者設定目錄
#     Windows：%APPDATA%\redmine-mcp\config.toml
#     其他平台：~/.config/redmine-mcp/config.toml
#   也可用 REDMINE_CONFIG 環境變數指定任意路徑。
#
# 安全提醒：本檔含 API key（權限等同該帳號）。若放在會被雲端同步的資料夾
# （OneDrive、Dropbox、iCloud 雲碟等）底下，金鑰會一併上傳。建議收緊檔案權限：
#   Windows：icacls config.toml /inheritance:r /grant:r "$env:USERNAME:(R)"
#   其他平台：chmod 600 config.toml

# ── 全域層級（選填）：各站台未指定時的預設值
#
# 下載附件由系統自動管理；其他本機檔案須放在站台指定的附件上傳目錄。
# 原始檔與舊自訂目錄不會遷移或清理。
# 暫存閒置滿 7 天壓縮，壓縮完成後保留 30 天再刪除；詳見 SETUP.md。
# 舊 download_dir / upload_dir 與對應環境變數已忽略，不再具有停用附件功能的語意。
#
# 單一附件的大小上限（MB）。
max_attachment_mb = 10

# ── 站台層級：每個 [sites.<代號>] 是一個 Redmine 站台
# 代號只能用英文、數字、減號與底線，需以英數開頭，長度 1–64。
# 它會出現在工具的 site 參數；附件依站台網址隔離儲存。

[sites.main]
url     = "https://redmine.example.com/redmine"
api_key = "<your-api-key>"
description = "公司正式站"
# 其他本機檔案可放入這個站台專用的上傳目錄（絕對路徑）。
# attachment_upload_root = 'C:\RedmineUploads\main'
# 舊站仍需使用 HTTP 時，在該站明確啟用（API key 將以明文傳送）。
# allow_insecure_http = true

# 需要第二個站台時複製下面這段，改掉代號與內容即可
# [sites.client-b]
# url     = "https://redmine.client-b.com"
# api_key = "<another-api-key>"
# description = "客戶 B 的正式站"

# ── 舊格式（仍然支援）
# 只接一個站台時，可以不寫 [sites.*]，直接把 url 與 api_key 放在最外層，
# 效果等同一個名為 default 的站台。但兩種寫法不可混用，混用會在啟動時報錯。
